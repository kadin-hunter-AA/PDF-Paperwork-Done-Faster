name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Pinned SDK 10.0.401 and PDFium chromium/8086; both downloads are SHA-256 checked.
      - name: Restore pinned SDK and PDFium
        run: ./development/tools/setup.ps1

      - name: Install pinned Python tooling
        run: |
          python -m pip install --disable-pip-version-check --target development/tools/python-packages -r development/tools/compatibility-requirements.txt
          python -m pip install --disable-pip-version-check --target development/tools/signing-packages -r development/tools/requirements-signed.txt

      - name: Stage isolated companion runtime
        run: |
          ./development/tools/Setup-AdvancedPython.ps1
          python -m pip install --disable-pip-version-check --target development/tools/advanced-python-3.14.8/packages pymupdf==1.28.2

      # Same pinned tessdata_fast commit and digests as tools/Setup-AdvancedOcr.ps1.
      - name: Stage pinned English OCR model
        run: |
          $data = 'development/tools/advanced-python-3.14.8/tessdata'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $base = 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd'
          foreach ($file in @(
              @{ Name = 'eng.traineddata'; Sha = '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2' },
              @{ Name = 'LICENSE'; Sha = 'cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30' })) {
            $path = Join-Path $data $file.Name
            Invoke-WebRequest -Uri "$base/$($file.Name)" -OutFile $path
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Sha) { throw "$($file.Name) failed its integrity check." }
          }

      - name: Build
        run: |
          & ./development/tools/dotnet/dotnet.exe build ./development/HunterPdf.slnx --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native and session regression (App.Tests)
        run: |
          & ./development/tools/dotnet/dotnet.exe run --no-build --project ./development/App.Tests -- ./development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Companion engine regression (quick tools, form panel, rich text)
        run: |
          foreach ($flag in "--quick-tools-only", "--form-panel-only", "--rich-text-only") {
            & ./development/tools/dotnet/dotnet.exe run --no-build --project ./development/App.Tests -- ./development $flag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The hosted runner has an interactive desktop session, so WPF windows can be created.
      - name: UI regression (App.UiTests)
        run: ./development/tools/run-ui-checks.ps1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: development/artifacts/
          if-no-files-found: ignore
          retention-days: 14
